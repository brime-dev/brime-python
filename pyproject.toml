[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "brime"
version = "0.2.0"
description = "Official Python SDK for the Brime API (search · extract · research)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brime", email = "support@brime.dev" }]
keywords = ["brime", "search", "extract", "research", "rag", "llm", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
]

# Legacy optional-dependencies for pip users who run `pip install brime[dev]`.
# uv users get the same set via the modern [dependency-groups] table below.
[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "respx>=0.21",
    "mypy>=1.10",
    "pyright>=1.1.380",
    "ruff>=0.7",
    "twine>=5.1",
    "build>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "respx>=0.21",
    "mypy>=1.10",
    "pyright>=1.1.380",
    "ruff>=0.7",
    "twine>=5.1",
    "build>=1.2",
]

[project.urls]
Homepage = "https://brime.dev"
Documentation = "https://docs.brime.dev"
Repository = "https://github.com/brime-dev/brime-python"
Issues = "https://github.com/brime-dev/brime-python/issues"
Changelog = "https://github.com/brime-dev/brime-python/blob/main/CHANGELOG.md"

# ─── Build ──────────────────────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/brime"]

[tool.hatch.build.targets.sdist]
include = ["src/brime", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

# ─── uv ─────────────────────────────────────────────────────────────────────
# Pin resolution to the official PyPI index so a misconfigured private mirror
# can't shadow a transitive dep. Astral example pattern.
[tool.uv]
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# ─── Lint + format ──────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TID",  # tidy imports
]
ignore = [
    "E501",  # line too long — formatter handles it
    "N818",  # exception name should end with Error — we use BrimeError as base
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "N"]

# ─── Type checking ──────────────────────────────────────────────────────────

[tool.mypy]
strict = true
python_version = "3.9"
files = ["src/brime"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pyright]
include = ["src/brime"]
exclude = ["**/__pycache__", "**/node_modules", "dist", "build", ".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.9"
reportMissingImports = true
reportUnusedImport = "warning"

# ─── Tests ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: marks tests requiring BRIME_API_KEY env var (deselect with -m 'not live')",
]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = ["-ra", "--strict-markers"]
